<form>
  <div class="input-group">
    <p>
      <label for="initial-investment">Initial Investment</label>
      <input type="number" id="initial-investment" placeholder="Enter initial investment" />
    </p>
    <p>
      <label for="annual-investment">Annual Investment</label>
      <input type="number" id="annual-investment" placeholder="Enter annual investment" />
    </p>
  </div>
  <div class="input-group">
    <p>
      <label for="expected-return">Expected Return</label>
      <input type="number" id="expected-return" placeholder="Enter expected return" />
    </p>
    <p>
      <label for="duration">Duration (years)</label>
      <input type="number" id="duration" placeholder="Enter duration" />
    </p>
  </div>
  <p>
    <button type="button">Calculate</button>
  </p>
</form>
